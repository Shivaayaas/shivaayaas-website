<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Shivaayaas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<a href="index.html" class="absolute left-4 top-4 bg-green-600 text-white px-3 py-1 rounded-full text-sm hover:bg-green-700 transition">
  ← Home
</a>

<body class="bg-green-50 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
  <nav>
    <ul>
        <li><a href="./index.html">Click to Home</a></li>
    </ul>
</nav>
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Admin Login</h2>
    <form id="adminLoginForm" class="space-y-4">
      <input type="text" id="username" placeholder="Username" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-300" />
      <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-300" />
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Login</button>
    </form>
    <p id="loginError" class="text-red-500 text-sm mt-2 hidden">Invalid credentials</p>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (username === 'admin' && password === 'shivaayaas123') {
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'admin-dashboard.html';
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
