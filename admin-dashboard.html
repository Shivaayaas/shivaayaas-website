<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Shivaayaas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-green-700 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Shivaayaas Admin Panel</h1>
    <button onclick="logout()" class="bg-red-500 px-4 py-1 rounded hover:bg-red-600">Logout</button>
  </header>

  <main class="p-6 max-w-4xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">🛒 Edit Product Data (Coming Soon)</h2>
    <p class="text-gray-600">This section will let you manage products and update prices, descriptions, or stock status.</p>
    <!-- Future editable form will come here -->
  </main>

  <script>
    if (localStorage.getItem('adminLoggedIn') !== 'true') {
      window.location.href = 'admin-login.html';
    }
    function logout() {
      localStorage.removeItem('adminLoggedIn');
      window.location.href = 'admin-login.html';
    }
  </script>
</body>
</html>
